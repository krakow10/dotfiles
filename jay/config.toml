# The keymap that is used for shortcuts and also sent to clients.
keymap = """
    xkb_keymap {
        xkb_keycodes { include "evdev+aliases(qwerty)" };
        xkb_types    { include "complete"              };
        xkb_compat   { include "complete"              };
        xkb_symbols  { include "pc+us+inet(evdev)"     };
    };
    """

# An action that will be executed when the GPU has been initialized.
on-graphics-initialized = [
    { type = "exec", exec = "mako" },
    { type = "exec", exec = "/usr/lib/polkit-kde-authentication-agent-1" },
]

show-bar = false
show-titles = false
idle.minutes = 10
render-device.name = "3080 Ti"
window-management-key = "Super_L"
repeat-rate = { rate = 25, delay = 500 }
unstable-mouse-follows-focus = true

[[inputs]]
tag = "mice"
match.is-pointer = true
transform-matrix = [[0.35, 0], [0, 0.35]]
accel-profile = "flat"
accel-speed = 0.5

[color-management]
enabled = true

[theme]
border-width = 0

[[drm-devices]]
name = "3080 Ti"
match = { pci-vendor = 0x10de, pci-model = 0x2208 }

[[drm-devices]]
name = "3060"
match = { pci-vendor = 0x10de, pci-model = 0x2503 }

[[outputs]]
name = "Left"
match.serial-number = "352208"
x = 0
y = 0
scale = 2
vrr = { mode = "never" }

[[outputs]]
name = "UltraGear"
match.serial-number = "507NTCZJJ475"
x = 1920
y = 0
scale = 2
vrr = { mode = "never" }
mode = { width = 3840, height = 2160, refresh-rate = 240 }
# mode = { width = 1920, height = 1080, refresh-rate = 480 }
color-space = "bt2020"
transfer-function = "pq"
format = "abgr2101010"

[[outputs]]
name = "Right"
match.serial-number = "205592"
x = 3840
y = 0
scale = 2
vrr = { mode = "never" }

# Shortcuts that are processed by the compositor.
# The left hand side should be a key, possibly prefixed with modifiers.
# The right hand side should be an action.
[shortcuts]
# The focus-X actions move the keyboard focus to next window on the X.
logo-h = "focus-left"
logo-j = "focus-down"
logo-k = "focus-up"
logo-l = "focus-right"

# The move-X actions move window that has the keyboard focus to the X.
logo-shift-h = "move-left"
logo-shift-j = "move-down"
logo-shift-k = "move-up"
logo-shift-l = "move-right"

# The split-X action places the currently focused window in a container
# and sets the split direction of the container to X.
logo-d = "split-horizontal"
logo-v = "split-vertical"

# The toggle-split action changes the split direction of the current
# container.
logo-t = "toggle-split"
# The toggle-mono action changes whether the current container shows
# a single window or all windows next to each other.
logo-m = "toggle-mono"
# The toggle-fullscreen action toggles the current window between
# windowed and fullscreen.
logo-f = "toggle-fullscreen"

# The focus-parent action moves the keyboard focus to the parrent of
# the currently focused window.
# logo-f = "focus-parent"
# The close action requests the currently focused window to close.
logo-c = "close"
# The toggle-floating action changes the currently focused window between
# floating and tiled.
logo-shift-f = "toggle-floating"

# screenshot
Print = { type = "exec", exec = { shell = "grim -g $(slurp) - | wl-copy", privileged = true } }

# All actions above are so-called simple actions that are identified by
# a string. More complex actions take parameters and are written as a table.
# For example, the exec action spawns an application and has the exec field
# that describes how to spawn the application.
logo-q = { type = "exec", exec = "ghostty" }
logo-e = { type = "exec", exec = "thunar" }
logo-r = { type = "exec", exec = ["tofi-drun", "--drun-launch=true"] }
logo-KP_Down = { type = "exec", exec = "zeditor" }
logo-KP_Next = { type = "exec", exec = "/opt/sublime_merge/sublime_merge" }
logo-KP_Left = { type = "exec", exec = "firefox-nightly" }
logo-KP_Begin = { type = "exec", exec = "deadbeef" }
logo-KP_Home = { type = "exec", exec = "Telegram" }
logo-KP_Prior = { type = "exec", exec = "obs" }
logo-KP_Insert = { type = "exec", exec = "firefox" }
logo-KP_Up = { type = "exec", exec = [
	"firejail",
	"--net=enp6s0",
	"--noprofile",
    "vesktop",
    "--ozone-platform-hint=auto",
    "--enable-features=UseOzonePlatform,VaapiVideoDecoder,VaapiIgnoreDriverChecks,AcceleratedVideoDecodeLinuxGL,AcceleratedVideoEncoder"
] }

# The quit action terminates the compositor.
logo-shift-e = "quit"
# The reload-config-toml action reloads the TOML configuration file.
logo-shift-r = "reload-config-toml"

# The switch-to-vt action switches to a different virtual terminal.
ctrl-logo-F1 = { type = "switch-to-vt", num = 1 }
ctrl-logo-F2 = { type = "switch-to-vt", num = 2 }
ctrl-logo-F3 = { type = "switch-to-vt", num = 3 }
ctrl-logo-F4 = { type = "switch-to-vt", num = 4 }
ctrl-logo-F5 = { type = "switch-to-vt", num = 5 }
ctrl-logo-F6 = { type = "switch-to-vt", num = 6 }
ctrl-logo-F7 = { type = "switch-to-vt", num = 7 }
ctrl-logo-F8 = { type = "switch-to-vt", num = 8 }
ctrl-logo-F9 = { type = "switch-to-vt", num = 9 }
ctrl-logo-F10 = { type = "switch-to-vt", num = 10 }
ctrl-logo-F11 = { type = "switch-to-vt", num = 11 }
ctrl-logo-F12 = { type = "switch-to-vt", num = 12 }

# The show-workspace action switches to a workspace. If the workspace is not
# currently being used, it is created on the output that contains the pointer.
logo-1 = { type = "show-workspace", name = "1" }
logo-2 = { type = "show-workspace", name = "2" }
logo-3 = { type = "show-workspace", name = "3" }
logo-4 = { type = "show-workspace", name = "4" }
logo-5 = { type = "show-workspace", name = "5" }
logo-6 = { type = "show-workspace", name = "6" }
logo-7 = { type = "show-workspace", name = "7" }
logo-8 = { type = "show-workspace", name = "8" }
logo-9 = { type = "show-workspace", name = "9" }
logo-0 = { type = "show-workspace", name = "0" }
# logo-F11 = { type = "show-workspace", name = "11" }
# logo-F12 = { type = "show-workspace", name = "12" }

# The move-to-workspace action moves the currently focused window to a workspace.
logo-shift-1 = { type = "move-to-workspace", name = "1" }
logo-shift-2 = { type = "move-to-workspace", name = "2" }
logo-shift-3 = { type = "move-to-workspace", name = "3" }
logo-shift-4 = { type = "move-to-workspace", name = "4" }
logo-shift-5 = { type = "move-to-workspace", name = "5" }
logo-shift-6 = { type = "move-to-workspace", name = "6" }
logo-shift-7 = { type = "move-to-workspace", name = "7" }
logo-shift-8 = { type = "move-to-workspace", name = "8" }
logo-shift-9 = { type = "move-to-workspace", name = "9" }
logo-shift-0 = { type = "move-to-workspace", name = "0" }
# logo-shift-F11 = { type = "move-to-workspace", name = "11" }
# logo-shift-F12 = { type = "move-to-workspace", name = "12" }
